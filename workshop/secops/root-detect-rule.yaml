# Custom rule to detect containers running as root
- rule: Container Running as Root
  desc: Detect containers that are running with root privileges
  condition: >
    spawned_process and
    container and
    proc.pname != "pause" and
    user.uid = 0 and
    not user_known_root_container_exceptions
  output: >
    Container running as root detected (user=%user.name uid=%user.uid command=%proc.cmdline
    container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag)
  priority: WARNING
  tags: [container, root, security]

# Exception list for legitimate root containers (customize as needed)
- list: root_container_exceptions
  items: [
    "falco",
    "node-exporter",
    "kube-proxy",
    "calico-node",
    "flannel"
  ]

# Namespace exception list
- list: root_namespace_exceptions
  items: ["kube-system", "kube-public", "falco-system"]
# Macro to define exceptions
- macro: user_known_root_container_exceptions
  condition: >
    (container.image.repository in (root_container_exceptions)) or
    (k8s.ns.name in (root_namespace_exceptions))

# Additional rule for detecting root process execution in non-system namespaces
- rule: Root Process in User Namespace
  desc: Detect root processes in user namespaces (non-system)
  condition: >
    spawned_process and
    container and
    user.uid = 0 and
    not k8s.ns.name in (root_process_namespace_exceptions) and
    not user_known_root_container_exceptions
  output: >
    Root process detected in user namespace (user=%user.name uid=%user.uid command=%proc.cmdline
    container_id=%container.id container_name=%container.name image=%container.image.repository:%container.image.tag
    namespace=%k8s.ns.name)
  priority: CRITICAL
  tags: [container, root, security, namespace]
- list: root_process_namespace_exceptions
  items: ["kube-system", "kube-public", "falco-system", "default"]

# Catch nc and other tools
- macro: container
  condition: container.id != host
- macro: spawned_process
  condition: (evt.type in (execve, execveat))
- rule: Suspicious Network Activity
  desc: Detect unexpected network connections
  condition: >
    spawned_process and container and
    proc.name in (nc, telnet, ncat) and
    not proc.args contains "allowed_host"
  output: >
    Suspicious network tool executed (user=%user.name container=%container.name
    image=%container.image.repository proc=%proc.cmdline)
  priority: WARNING

# Open a file 
- macro: file_open
  condition: >
    (evt.type=open or evt.type=openat) and
    fd.typechar='f'
- macro: is_secure_dir
  condition: >
    fd.directory in (secure_dir)
- list: secure_dir
  items: ["/etc"]
